name: Redraw weekly banner

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC
  workflow_dispatch: # manual "run now" button
  push:
    branches: [main]
    paths:
      - "scripts/build-banner.mjs"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Draw banner
        run: node scripts/build-banner.mjs

      - name: Commit if changed
        run: |
          git config user.name  "jeffery-prod"
          git config user.email "241513000+jeffery-prod@users.noreply.github.com"
          git add assets/banner.svg
          if git diff --staged --quiet; then
            echo "No change to the banner."
          else
            git commit -m "Redraw the weekly banner"
            git push
          fi
